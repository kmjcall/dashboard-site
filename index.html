/* 자료받기: 대시보드 현재 데이터(클로드가 반영한 변경 포함)를 엑셀 프로젝트목록 형식으로 내려받기.
   이슈는 해당 포트폴리오 '사업명' 셀의 메모(코멘트)로 넣음 — 이 브라우저에서 입력한 이슈가 있으면 그것을 우선 */
function exportPortfolioXlsx() {
  if (typeof XLSX === "undefined") { alert("엑셀 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요."); return; }
  const YEARS = []; for (let y = 2016; y <= 2026; y++) YEARS.push(String(y));
  const COLS = [
    ["번호","no"],["사업명","name"],["투자대상","target"],["전략자산","strategic"],["투자시기","year"],["대분류","cat"],["운용사","mgr"],
    ["지분유형","share"],["투자법인","corp"],["MOIC","moic"],["투자벨류","val0"],["현재벨류","val1"],["Multiple","mult"],
    ["최초지분","stake0"],["현재지분","stake1"],["약정총액","commit"],["누적투자액","invested"],["잔여약정액","remain"],
    ["총회수","rec"],["원금","prin"],["배당","div"],["미회수잔액","unrec"],["회수율","rate"]];
  const SUMK = ["commit","invested","remain","rec","prin","div","unrec"];
  const nBase = COLS.length, nCols = nBase + YEARS.length * 3;
  const enc = (r, c) => XLSX.utils.encode_cell({ r, c });
  const ws = {}; const merges = []; let R = 0;
  const put = (r, c, v, z, f) => { if (v === null || v === undefined || v === "") { if (!f) return; }
    const cell = f ? { t:"n", f, v: (typeof v === "number" ? v : 0) } : (typeof v === "number" ? { t:"n", v } : { t:"s", v: String(v) });
    if (z) cell.z = z; ws[enc(r, c)] = cell; };
  const NUM = '#,##0.0;(#,##0.0);""', DEC = '0.00;-0.00;""', PCT = '0.0%;-0.0%';
  const fmtOf = k => k === "rate" ? PCT : (k === "moic" || k === "mult") ? DEC : (["val0","val1"].includes(k) ? '#,##0;(#,##0);""' : (SUMK.includes(k) ? NUM : null));
  const now = new Date(), pad = n => String(n).padStart(2, "0");
  const stamp = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate());
  put(R, 0, "투자사업팀 포트폴리오 현황 (대시보드 반영본)"); merges.push({ s:{r:R,c:0}, e:{r:R,c:8} }); R++;
  put(R, 0, "원본 기준일 " + SEED_PORTFOLIO.asof + " · 내려받은 시각 " + now.getFullYear() + "." + pad(now.getMonth()+1) + "." + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + " · 단위: 억원 · 이슈는 사업명 셀 메모로 표시");
  merges.push({ s:{r:R,c:0}, e:{r:R,c:12} }); R += 2;
  // 머리글 2줄 (연도 묶음)
  COLS.forEach(([h], c) => { put(R, c, h); put(R+1, c, ""); merges.push({ s:{r:R,c}, e:{r:R+1,c} }); });
  YEARS.forEach((y, i) => { const c0 = nBase + i*3; put(R, c0, y + "년"); merges.push({ s:{r:R,c:c0}, e:{r:R,c:c0+2} });
    ["출자","원금","배당"].forEach((h, j) => put(R+1, c0+j, h)); });
  R += 2;
  const memo = (r) => { let t = ""; try { t = localStorage.getItem("inv_issue_" + r._sec + "_" + r.no) || ""; } catch (e) {} return t || r.issue || ""; };
  let nMemo = 0; const memoAt = {};
  SEED_PORTFOLIO.sections.forEach(sec => {
    put(R, 0, sec.label + " (" + sec.rows.length + "건)"); merges.push({ s:{r:R,c:0}, e:{r:R,c:8} }); R++;
    const first = R;
    sec.rows.forEach(row => {
      const r = { ...row, _sec: sec.key };
      COLS.forEach(([h, k], c) => {
        let v = r[k];
        if (k === "strategic") v = r.strategic ? "O" : "";
        if ((k === "moic" || k === "mult") && Number(v) === 0) v = null;
        put(R, c, v, fmtOf(k));
      });
      YEARS.forEach((y, i) => { const t = (r.yr || {})[y]; if (!t) return; t.forEach((v, j) => { if (v) put(R, nBase + i*3 + j, v, NUM); }); });
      const text = memo(r);
      if (text) { const a = enc(R, 1); if (!ws[a]) ws[a] = { t:"s", v:"" };
        ws[a].c = [{ a: "투자사업팀", t: text }]; ws[a].c.hidden = true; memoAt[R] = text; nMemo++; }
      R++;
    });
    const last = R - 1;
    put(R, 1, "합계");
    const colL = c => XLSX.utils.encode_col(c);
    COLS.forEach(([h, k], c) => { if (!SUMK.includes(k)) return;
      const v = sec.rows.reduce((a, x) => a + (Number(x[k]) || 0), 0);
      put(R, c, v, NUM, "SUM(" + colL(c) + (first+1) + ":" + colL(c) + (last+1) + ")"); });
    const ci = COLS.findIndex(c => c[1] === "invested"), cr = COLS.findIndex(c => c[1] === "rec"), cRate = COLS.findIndex(c => c[1] === "rate");
    const sInv = Math.abs(sec.rows.reduce((a, x) => a + (Number(x.invested) || 0), 0)), sRec = sec.rows.reduce((a, x) => a + (Number(x.rec) || 0), 0);
    put(R, cRate, sInv ? sRec / sInv : 0, PCT, "IFERROR(" + colL(cr) + (R+1) + "/ABS(" + colL(ci) + (R+1) + "),0)");
    YEARS.forEach((y, i) => [0,1,2].forEach(j => { const c = nBase + i*3 + j;
      const v = sec.rows.reduce((a, x) => a + (Number(((x.yr || {})[y] || [])[j]) || 0), 0);
      put(R, c, v, NUM, "SUM(" + colL(c) + (first+1) + ":" + colL(c) + (last+1) + ")"); }));
    R += 2;
  });
  ws["!ref"] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:R,c:nCols-1} });
  ws["!merges"] = merges;
  const W = { no:5, name:30, target:22, strategic:7, year:7, cat:10, mgr:20, share:12, corp:12, stake0:14, stake1:14 };
  ws["!cols"] = COLS.map(([h, k]) => ({ wch: W[k] || 10 })).concat(YEARS.flatMap(() => [{wch:8},{wch:8},{wch:8}]));
  ws["!freeze"] = { xSplit: 2, ySplit: 6 };
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "프로젝트목록");
  const fname = "투자사업팀포트폴리오현황_" + stamp + "_대시보드.xlsx";
  if (typeof JSZip === "undefined" || !nMemo) { XLSX.writeFile(wb, fname); return nMemo; }
  // 메모 상자 크기를 내용에 맞게 키움: 폭 고정(약 C~H열), 높이는 줄 수(줄바꿈 포함)에 비례
  const vw = str => { let w = 0; for (const ch of str) w += ch.charCodeAt(0) > 0x2E7F ? 2 : 1; return w; };
  const CAP = 74, COL_FROM = 2, COL_TO = 8, WIDTH_PT = 420;
  const rowsFor = t => { const lines = String(t).split(/\r?\n/).reduce((n, ln) => n + Math.max(1, Math.ceil(vw(ln) / CAP)), 0);
    return Math.max(4, Math.ceil(lines * 17 / 20) + 2); };
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const download = (blob) => { const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); };
  JSZip.loadAsync(out).then(zip => {
    const jobs = [];
    zip.forEach((path, f) => {
      if (/^xl\/drawings\/vmlDrawing\d+\.vml$/.test(path)) jobs.push(f.async("string").then(x => {
        x = x.replace(/<v:shape [\s\S]*?<\/v:shape>/g, sh => {
          const m = sh.match(/<x:Row>(\d+)<\/x:Row>/); if (!m) return sh;
          const r = Number(m[1]), n = rowsFor(memoAt[r] || "");
          return sh
            .replace(/width:[\d.]+pt;height:[\d.]+pt/, "width:" + WIDTH_PT + "pt;height:" + (n * 15) + "pt")
            .replace(/fillcolor="[^"]*"/, 'fillcolor="#FFFFE1"').replace(/strokecolor="[^"]*"/, 'strokecolor="#8a8a8a"')
            .replace(/<v:fill [\s\S]*?<\/v:fill>/, '<v:fill color2="#FFFFE1"/>')
            .replace(/<x:Anchor>[^<]*<\/x:Anchor>/, "<x:Anchor>" + COL_FROM + ",15," + Math.max(0, r - 1) + ",4," + COL_TO + ",0," + (Math.max(0, r - 1) + n) + ",4</x:Anchor>")
            .replace("<x:SizeWithCells/>", "");
        });
        zip.file(path, x);
      }));
      // 메모 글꼴: 맑은 고딕 10pt
      if (/^xl\/comments\d*\.xml$/.test(path)) jobs.push(f.async("string").then(x => {
        zip.file(path, x.replace(/<text><t([^>]*)>/g, '<text><r><rPr><sz val="10"/><rFont val="맑은 고딕"/><family val="3"/></rPr><t$1>').replace(/<\/t><\/text>/g, "</t></r></text>"));
      }));
    });
    return Promise.all(jobs).then(() => zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  }).then(download).catch(() => XLSX.writeFile(wb, fname));
  return nMemo;
}

/* 자동 순차 플립: 1번 뒤집힘 → 원위치 → 2번 뒤집힘 → 원위치 → 3번 … 반복(카드당 3초). 마우스를 카드 줄에 올리면 멈춤 */
function useKpiSeqFlip(n) {
  const [idx, setIdx] = useState(-1);
  const pausedRef = useRef(false);
  useEffect(() => {
    let i = 0, timers = [], alive = true;
    const later = (fn, ms) => timers.push(setTimeout(() => alive && fn(), ms));
    const cycle = () => {
      if (pausedRef.current) { later(cycle, 500); return; }
      setIdx(i);                                   // 뒤집기 (0.6초 회전)
      later(() => setIdx(-1), 2000);               // 뒷면 1.4초 보여준 뒤 원위치
      later(() => { i = (i + 1) % n; cycle(); }, 3000);  // 원위치 완료 후 다음 카드
    };
    later(cycle, 1500);
    return () => { alive = false; timers.forEach(clearTimeout); };
  }, [n]);
  return [idx, (p) => { pausedRef.current = p; }];
}

  const [localQuarterly, setLocalQuarterly] = useState(quarterly);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  const applyQuarterlyDelta = (q, year, quarter, invDelta, recDelta, proDelta) => {
    const key = year + (quarter||"Q1");
    const updated = { ...q };
    if (!updated[key]) updated[key] = { investment:0, recovery:0, profit:0 };
    updated[key] = {
      investment: Math.max(0, (updated[key].investment||0) + invDelta),
      recovery:   Math.max(0, (updated[key].recovery||0)   + recDelta),
      profit:     Math.max(0, (updated[key].profit||0)     + proDelta),
    };
    return updated;

  const startEdit = (item) => {
    setEditingId(item.id);

    setAddForm(null);

function PortfolioTable({ section, cat, search, year, onRowClick }) {
  const narrow = typeof window !== "undefined" && window.innerWidth < 640;
  const COLS = (narrow ? PORT_COLS.map(c => c.k === "name" ? { ...c, w:150 } : c) : PORT_COLS).concat(PORT_YR_COLS);
  const TABLE_W = COLS.reduce((s, c) => s + c.w, 0);
  const scrollRef = useRef(null);
  const [atEdge, setAtEdge] = useState({ left:true, right:false });
  const [maxH, setMaxH] = useState(null);
  useEffect(() => {
    const upd = () => {
      const el = scrollRef.current; if (!el) return;
      setMaxH(Math.max(320, window.innerHeight - (el.getBoundingClientRect().top) - 14));
    };
    upd();
    window.addEventListener("resize", upd);
    const vv = window.visualViewport; if (vv) vv.addEventListener("resize", upd);
    return () => { window.removeEventListener("resize", upd); if (vv) vv.removeEventListener("resize", upd); };
  }, [section, cat, search]);
  const updateEdge = () => {
    const el = scrollRef.current; if (!el) return;
    setAtEdge({ left: el.scrollLeft <= 2, right: el.scrollLeft + el.clientWidth >= el.scrollWidth - 2 });
  };
  const scrollBy = (dir) => {
    const el = scrollRef.current; if (!el) return;
    const step = Math.max(240, Math.round(el.clientWidth * 0.6));
    el.scrollBy({ left: dir * step, behavior: "smooth" });
    setTimeout(updateEdge, 400);
  };
  const q = (search || "").trim().toLowerCase();
  const byYear = cat === "year", byCorp = cat === "corp";
  const matches = r => {
    if (!byYear && !byCorp && cat !== "all" && r.cat !== cat) return false;
    if (!q) return true;
    return [r.name, r.target, r.mgr, r.corp, r.share].some(v => String(v || "").toLowerCase().includes(q));
  };
  const filtering = !!q || cat !== "all";
  let sections;
  if (byCorp) {
    // 투자법인별: 건수 많은 법인 순(같으면 가나다), 법인 칸이 비어 있으면 '미상'
    const pool = SEED_PORTFOLIO.sections
      .filter(s => section === "all" || s.key === section)
      .reduce((acc, s) => acc.concat(s.rows.filter(matches).map(r => ({ ...r, _sec: s.key }))), []);
    // 사명 변경 건은 같은 회사로 묶음(표의 투자법인 칸 값은 엑셀 그대로 둠)
    const CORP_SAME = { "우미산업개발(선우산업)": "우미산업개발" };
    const cKey = r => { const c = String(r.corp || "").trim(); return c ? (CORP_SAME[c] || c) : "미상"; };
    const cnt = {}; pool.forEach(r => { cnt[cKey(r)] = (cnt[cKey(r)] || 0) + 1; });
    const corps = Object.keys(cnt).sort((a, b) => (cnt[b] - cnt[a]) || a.localeCompare(b, "ko"));
    sections = corps.map(c => ({ key: "c" + c, label: c, rows: pool.filter(r => cKey(r) === c), isYear: true }));
  } else if (byYear) {
    const pool = SEED_PORTFOLIO.sections
      .filter(s => section === "all" || s.key === section)
      .reduce((acc, s) => acc.concat(s.rows.filter(matches).map(r => ({ ...r, _sec: s.key }))), []);
    const yKey = r => (r.year === "" || r.year == null) ? "미상" : String(r.year);
    const years = [...new Set(pool.map(yKey))].sort();
    sections = years
      .filter(y => year === "all" || y === year)
      .map(y => ({ key: "y" + y, label: y === "미상" ? "투자시기 미상" : y + "년", rows: pool.filter(r => yKey(r) === y), isYear: true }));
  } else {
    sections = SEED_PORTFOLIO.sections
      .filter(s => section === "all" || s.key === section)

  const acc = {};
  rows.forEach(r => {
    const yr = r.yr || {};
    Object.keys(yr).forEach(y => {
      if (!acc[y]) acc[y] = { 투자:0, 원금:0, 배당:0 };
      acc[y].투자 += yr[y][0] || 0; acc[y].원금 += yr[y][1] || 0; acc[y].배당 += yr[y][2] || 0;
    });
  });
  let run = { 투자:0, 원금:0, 배당:0 };
  const r1 = v => Math.round(v * 10) / 10;
  return Object.keys(acc).sort().map(y => {
    const cur = cumulative
      ? (run = { 투자: run.투자 + acc[y].투자, 원금: run.원금 + acc[y].원금, 배당: run.배당 + acc[y].배당 })

            React.createElement('div', { style: { display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" },}
              , React.createElement('span', { style: { fontSize:13, color:"#111", fontWeight:800, minWidth:48 },}, "대분류:")
              , [["all","전체"],["strategic","전략자산"],["nonstrategic","수익자산"]].map(([v,l]) => (
                React.createElement('button', { key: v, onClick: () => setSelectedStrategic(v),
                  style: { padding:"6px 14px", borderRadius:6, border:"1px solid #e2e8f0", cursor:"pointer", fontSize:12,
                    background:selectedStrategic===v?"#4f46e5":"#fff", color:selectedStrategic===v?"#fff":"#555", fontWeight:600 },}, l)
              ))
            )
          )
          , activeTab !== "projects" && (
            React.createElement('div', { style: { display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" },}
              , React.createElement('span', { style: { fontSize:13, color:"#111", fontWeight:800, minWidth:48 },}, "중분류:")
              , [["all","전체"],["신사업","신사업"],["공간테크","공간테크"],["기타","기타"]].map(([v,l]) => (
                React.createElement('button', { key: v, onClick: () => setSelectedSubcat(v),
                  style: { padding:"6px 14px", borderRadius:6, border:"1px solid #e2e8f0", cursor:"pointer", fontSize:12,
                    background:selectedSubcat===v?"#4f46e5":"#fff", color:selectedSubcat===v?"#fff":"#555", fontWeight:600 },}, l)
              ))
            )
          )
          , activeTab === "projects" && (
            React.createElement('div', { className: "port-filter-row", style: { display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" },}
              , React.createElement('span', { className: "port-flabel", style: { fontSize:14, color:"#111", fontWeight:800, whiteSpace:"nowrap" },}, "구분")
              , React.createElement('div', { className: "port-chip-group", style: { display:"flex", gap:8, alignItems:"center", flexWrap:"wrap",
                  background:"#d6e4f5", border:"1px solid #a9c3e3", padding:"5px 10px", borderRadius:8 },}
                , [["all","전체"],["active","투자목록"],["closed","청산목록"],["impaired","손상목록"]].map(([v,l]) => (
                  React.createElement('button', { key: v, onClick: () => setPortSection(v), style: chipStyle(portSection===v),}, l)
                ))
              )
              , React.createElement('span', { className: "port-flabel", style: { fontSize:14, color:"#111", fontWeight:800, marginLeft:10, whiteSpace:"nowrap" },}, "대분류")
              , React.createElement('div', { className: "port-chip-group", style: { display:"flex", gap:8, alignItems:"center", flexWrap:"wrap",
                  background:"#d6e4f5", border:"1px solid #a9c3e3", padding:"5px 10px", borderRadius:8 },}
                , [["all","전체"], ["year","연도별"], ["corp","법인별"], ...PORT_CATS.map(c => [c, c])].map(([v,l]) => (
                  React.createElement('button', { key: v, onClick: () => { setPortCat(v); setPortYear("all"); },
                    style: (v === "year" || v === "corp")
                      ? { ...chipStyle(portCat===v), border:"2px solid #ef4444", fontWeight:700,
                          color: portCat===v ? "#fff" : "#dc2626", background: portCat===v ? "#dc2626" : "#fff5f5" }
                      : chipStyle(portCat===v),}, l)
                ))
              )
              , React.createElement('input', { className: "port-search", value: portSearch, onChange: e => setPortSearch(e.target.value),
                placeholder: "🔍 포트폴리오검색",
                style: { marginLeft:"auto", padding:"7px 12px", borderRadius:8, border:"2px solid #00529b", fontSize:13, fontWeight:600,
                  outline:"none", flex:"0 1 200px", minWidth:130, width:200, background:"#eaf2fb", color:"#1a1a2e",
                  boxShadow:"0 0 0 3px rgba(0,82,155,0.15)" },} )
            )
          )
        )

        /* ── PROJECTS TAB (항목별 현황 · 표) ── */
        , activeTab === "projects" && (
          React.createElement('div', null
            , issueItem && React.createElement(IssueModal, { item: issueItem, onClose: () => setIssueItem(null) })
            , React.createElement(PortfolioTable, { section: portSection, cat: portCat, search: portSearch, year: portYear, onRowClick: setIssueItem,} )
          )
        )
      )
    )
    )
  );
}

function initApp() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(InvestmentDashboard));
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
  </script>
</body>
